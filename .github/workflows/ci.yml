name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Package tests
        # xcodebuild, not swift test: it compiles the String Catalogs on every Xcode.
        working-directory: PinxelKit
        env:
          TEST_RUNNER_CI: 'true'   # xcodebuild passes it to the tests as CI
        run: xcodebuild test -scheme PinxelKit-Package -destination 'platform=macOS' -derivedDataPath ../build/ci-package

      - name: Build the app and the UI tests
        # Ad hoc signature (App/Config/Base.xcconfig): no certificate needed.
        run: |
          xcodegen generate
          xcodebuild -project Pinxel.xcodeproj -scheme Pinxel -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath build/ci build-for-testing

      - name: Build the Mac App Store version
        # The sandboxed configuration, signed ad hoc: it catches what breaks only in the App Store build.
        run: |
          xcodebuild -project Pinxel.xcodeproj -scheme Pinxel -configuration AppStore \
            -destination 'generic/platform=macOS' -derivedDataPath build/ci-appstore \
            CODE_SIGN_IDENTITY=- PROVISIONING_PROFILE_SPECIFIER= build
          codesign -d --entitlements - build/ci-appstore/Build/Products/AppStore/Pinxel.app | grep -q com.apple.security.app-sandbox

      - name: Every string in the code has a translation
        run: python3 scripts/l10n/xcstrings.py coverage build/ci .
