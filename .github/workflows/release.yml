name: Release

# Pushing a tag vX.Y.Z builds, signs and publishes Pinxel X.Y.Z.
# Needs docs/releases/X.Y.Z.md, MARKETING_VERSION X.Y.Z in project.yml, and:
#   secrets.MACOS_CERTIFICATE_P12       the Apple Development certificate (.p12, base64)
#   secrets.MACOS_CERTIFICATE_PASSWORD  the .p12 password
#   vars.DEVELOPMENT_TEAM               the team ID of that certificate
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the version from the tag
        run: echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Check the release notes exist
        run: test -f "docs/releases/$VERSION.md" || { echo "::error::docs/releases/$VERSION.md is missing"; exit 1; }

      - name: Select the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Package tests
        # xcodebuild, not swift test: it compiles the String Catalogs on every Xcode.
        working-directory: PinxelKit
        env:
          TEST_RUNNER_CI: 'true'   # xcodebuild passes it to the tests as CI
        run: xcodebuild test -scheme PinxelKit-Package -destination 'platform=macOS' -derivedDataPath ../build/ci-package

      - name: Import the signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          DEVELOPMENT_TEAM: ${{ vars.DEVELOPMENT_TEAM }}
        run: |
          if [ -z "$CERTIFICATE_P12" ] || [ -z "$CERTIFICATE_PASSWORD" ] || [ -z "$DEVELOPMENT_TEAM" ]; then
            echo "::error::MACOS_CERTIFICATE_P12, MACOS_CERTIFICATE_PASSWORD or DEVELOPMENT_TEAM is not set"
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          curl -fsSL -o "$RUNNER_TEMP/wwdr.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security import "$RUNNER_TEMP/wwdr.cer" -k "$KEYCHAIN" -T /usr/bin/codesign || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          security find-identity -v -p codesigning "$KEYCHAIN" | sed -E 's/[0-9A-F]{40}/<hash>/'
          printf 'CODE_SIGN_STYLE = Manual\nCODE_SIGN_IDENTITY = Apple Development\nDEVELOPMENT_TEAM = %s\n' \
            "$DEVELOPMENT_TEAM" > App/Config/Signing.local.xcconfig

      - name: Build and package
        run: scripts/release/package.sh "$VERSION"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release/notes.sh "$VERSION" "build/dist-$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" \
            "build/dist-$VERSION/Pinxel-$VERSION.dmg" "build/dist-$VERSION/Pinxel-$VERSION.zip" \
            --title "Pinxel $VERSION" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
