name: Release

# Pushing a tag vX.Y.Z builds, signs and publishes Pinxel X.Y.Z.
# Needs docs/releases/X.Y.Z.md, MARKETING_VERSION X.Y.Z in project.yml, and:
#   secrets.MACOS_CERTIFICATE_P12       the Developer ID Application certificate (.p12, base64)
#   secrets.MACOS_CERTIFICATE_PASSWORD  the .p12 password
#   secrets.NOTARY_APPLE_ID             the Apple ID of the developer account
#   secrets.NOTARY_PASSWORD             an app-specific password of that Apple ID
#   vars.DEVELOPMENT_TEAM               the team ID
# The Mac App Store build (job app-store) also needs, or is skipped without MAS_CERTIFICATES_P12:
#   secrets.MAS_CERTIFICATES_P12        "Apple Distribution" and "Mac Installer Distribution" (.p12, base64)
#   secrets.MAS_CERTIFICATES_PASSWORD   the .p12 password
#   secrets.MAS_PROVISIONING_PROFILE    the Mac App Store provisioning profile (base64)
#   secrets.ASC_KEY_P8                  an App Store Connect API key (.p8 contents), role App Manager
#   secrets.ASC_KEY_ID, ASC_ISSUER_ID   its key ID and issuer ID
# Running it by hand (Actions ▸ Release ▸ Run workflow, or `gh workflow run Release`)
# is a dry run: it builds, signs and notarizes the version in project.yml and keeps
# the dmg and zip as a workflow artifact, without publishing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 150
    env:
      PUBLISH: ${{ github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        run: |
          if [ "$PUBLISH" = true ]; then
            VERSION=${GITHUB_REF_NAME#v}
          else
            VERSION=$(sed -nE 's/^ *MARKETING_VERSION: "(.*)"/\1/p' project.yml)
          fi
          echo "Version: $VERSION (publish: $PUBLISH)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Check the release notes exist
        if: env.PUBLISH == 'true'
        run: test -f "docs/releases/$VERSION.md" || { echo "::error::docs/releases/$VERSION.md is missing"; exit 1; }

      - name: Select the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Package tests
        # xcodebuild, not swift test: it compiles the String Catalogs on every Xcode.
        working-directory: PinxelKit
        env:
          TEST_RUNNER_CI: 'true'   # xcodebuild passes it to the tests as CI
        run: xcodebuild test -scheme PinxelKit-Package -destination 'platform=macOS' -derivedDataPath ../build/ci-package

      - name: Import the signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          DEVELOPMENT_TEAM: ${{ vars.DEVELOPMENT_TEAM }}
        run: |
          if [ -z "$CERTIFICATE_P12" ] || [ -z "$CERTIFICATE_PASSWORD" ] || [ -z "$DEVELOPMENT_TEAM" ]; then
            echo "::error::MACOS_CERTIFICATE_P12, MACOS_CERTIFICATE_PASSWORD or DEVELOPMENT_TEAM is not set"
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          curl -fsSL -o "$RUNNER_TEMP/developer-id-ca.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security import "$RUNNER_TEMP/developer-id-ca.cer" -k "$KEYCHAIN" -T /usr/bin/codesign || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          security find-identity -v -p codesigning "$KEYCHAIN" | sed -E 's/[0-9A-F]{40}/<hash>/'
          printf 'CODE_SIGN_STYLE = Manual\nCODE_SIGN_IDENTITY = Developer ID Application\nDEVELOPMENT_TEAM = %s\n' \
            "$DEVELOPMENT_TEAM" > App/Config/Signing.local.xcconfig

      - name: Build, notarize and package
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ vars.DEVELOPMENT_TEAM }}
        run: scripts/release/package.sh "$VERSION"

      - name: Keep the packages (dry run)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Pinxel-${{ env.VERSION }}-dry-run
          path: build/dist-${{ env.VERSION }}/
          retention-days: 7

      - name: Publish the release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release/notes.sh "$VERSION" "build/dist-$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" \
            "build/dist-$VERSION/Pinxel-$VERSION.dmg" "build/dist-$VERSION/Pinxel-$VERSION.zip" \
            --title "Pinxel $VERSION" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  app-store:
    # The Mac App Store build: on a tag it is uploaded to App Store Connect, in a dry run it is only exported.
    # Skipped (with a notice) until the App Store secrets are set.
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      PUBLISH: ${{ github.ref_type == 'tag' }}
      MAS_CERTIFICATES_P12: ${{ secrets.MAS_CERTIFICATES_P12 }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the App Store settings
        id: settings
        run: |
          if [ -z "$MAS_CERTIFICATES_P12" ]; then
            echo "::notice::App Store secrets not set: skipping the Mac App Store build"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the version
        if: steps.settings.outputs.enabled == 'true'
        run: |
          if [ "$PUBLISH" = true ]; then
            VERSION=${GITHUB_REF_NAME#v}
          else
            VERSION=$(sed -nE 's/^ *MARKETING_VERSION: "(.*)"/\1/p' project.yml)
          fi
          echo "Version: $VERSION (upload: $PUBLISH)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Select the newest Xcode
        if: steps.settings.outputs.enabled == 'true'
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        if: steps.settings.outputs.enabled == 'true'
        run: brew install xcodegen

      - name: Import the certificates and the provisioning profile
        if: steps.settings.outputs.enabled == 'true'
        env:
          CERTIFICATES_PASSWORD: ${{ secrets.MAS_CERTIFICATES_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.MAS_PROVISIONING_PROFILE }}
          DEVELOPMENT_TEAM: ${{ vars.DEVELOPMENT_TEAM }}
        run: |
          if [ -z "$CERTIFICATES_PASSWORD" ] || [ -z "$PROVISIONING_PROFILE" ] || [ -z "$DEVELOPMENT_TEAM" ]; then
            echo "::error::MAS_CERTIFICATES_PASSWORD, MAS_PROVISIONING_PROFILE or DEVELOPMENT_TEAM is not set"
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/appstore.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$MAS_CERTIFICATES_P12" | base64 --decode > "$RUNNER_TEMP/certificates.p12"
          curl -fsSL -o "$RUNNER_TEMP/wwdr-g3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificates.p12" -k "$KEYCHAIN" -P "$CERTIFICATES_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
          security import "$RUNNER_TEMP/wwdr-g3.cer" -k "$KEYCHAIN" -T /usr/bin/codesign || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificates.p12"
          security find-identity -v "$KEYCHAIN" | sed -E 's/[0-9A-F]{40}/<hash>/'

          echo "$PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.provisionprofile"
          security cms -D -i "$RUNNER_TEMP/profile.provisionprofile" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/profile.plist")
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/profile.provisionprofile" "$dir/$UUID.provisionprofile"
          done
          echo "Provisioning profile: $NAME"
          printf 'CODE_SIGN_STYLE = Manual\nDEVELOPMENT_TEAM = %s\n' "$DEVELOPMENT_TEAM" > App/Config/Signing.local.xcconfig
          printf 'PROVISIONING_PROFILE_SPECIFIER = %s\n' "$NAME" > App/Config/AppStore.local.xcconfig

      - name: Build and export (dry run)
        if: steps.settings.outputs.enabled == 'true' && env.PUBLISH != 'true'
        run: scripts/release/appstore.sh "$VERSION"

      - name: Keep the package (dry run)
        if: steps.settings.outputs.enabled == 'true' && env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Pinxel-${{ env.VERSION }}-app-store-dry-run
          path: build/appstore-${{ env.VERSION }}/
          retention-days: 7

      - name: Build and upload to App Store Connect
        if: steps.settings.outputs.enabled == 'true' && env.PUBLISH == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$ASC_KEY_PATH"
          UPLOAD=1 ASC_KEY_PATH="$ASC_KEY_PATH" scripts/release/appstore.sh "$VERSION"
          rm "$ASC_KEY_PATH"

      - name: Remove the signing keychain
        if: always() && steps.settings.outputs.enabled == 'true'
        run: security delete-keychain "$RUNNER_TEMP/appstore.keychain-db" || true
