name: Pinxel
options:
  bundleIdPrefix: com.degiorgi
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  PinxelKit:
    path: PinxelKit
configFiles:
  Debug: App/Config/Base.xcconfig
  Release: App/Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "3"
targets:
  Pinxel:
    type: application
    platform: macOS
    sources: [App/Pinxel]
    dependencies:
      - package: PinxelKit
        product: DocumentModel
      - package: PinxelKit
        product: Rendering
      - package: PinxelKit
        product: Persistence
      - package: PinxelKit
        product: CaptureKit
      - package: PinxelKit
        product: AppCore
      - package: PinxelKit
        product: EditorUI
      - package: PinxelKit
        product: Library
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.degiorgi.pinxel
        PRODUCT_NAME: Pinxel
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          # Notarization rejects the debugging entitlement Xcode adds by default.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    info:
      path: App/Pinxel/Info.plist
      properties:
        CFBundleDisplayName: Pinxel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.graphics-design
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "© 2026 Giovanni Degiorgi"
        CFBundleDocumentTypes:
          - CFBundleTypeName: Pinxel Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [com.degiorgi.pinxel.document]
            NSDocumentClass: PinxelFileDocument
          # Le immagini si aprono in un documento nuovo (PinxelDocumentController); Pinxel non le rivendica.
          - CFBundleTypeName: Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.png, public.jpeg, public.heic, public.tiff, com.compuserve.gif, com.microsoft.bmp, org.webmproject.webp]
            NSDocumentClass: PinxelFileDocument
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.degiorgi.pinxel.document
            UTTypeDescription: Pinxel Document
            UTTypeConformsTo: [public.data, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [pinxel]
  PinxelUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [App/PinxelUITests]
    dependencies:
      - target: Pinxel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.degiorgi.pinxel.uitests
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Pinxel:
    build:
      targets:
        Pinxel: all
        PinxelUITests: [test]
    test:
      targets: [PinxelUITests]
