# SonarQube Cloud analysis, run by the CI workflow on every pull request and on main.
# The token comes from the SONAR_TOKEN repository secret.
sonar.organization=degiorgig
sonar.projectKey=degiorgig_pinxel
sonar.projectName=Pinxel
sonar.sourceEncoding=UTF-8

sonar.sources=App/Pinxel,PinxelKit/Sources,scripts
sonar.tests=App/PinxelUITests,PinxelKit/Tests
# String Catalogs and generated projects are not code.
sonar.exclusions=**/*.xcstrings,**/*.xcassets/**,build/**,**/.build/**

# Written by scripts/sonar/xccov_to_generic.py from the package tests' result bundle.
sonar.coverageReportPaths=build/sonar-coverage.xml
# Only the package has unit tests: the app is covered by UI tests, the scripts by none.
sonar.coverage.exclusions=App/**,scripts/**
